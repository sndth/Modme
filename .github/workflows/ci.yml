name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows ${{ matrix.arch }} / ${{ matrix.configuration }}
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
        configuration: [Debug, Release, ASan]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Locate MSBuild
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          "$vs/MSBuild/Current/Bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Generate projects
        run: ./premake5.exe vs2022
      - name: Build
        shell: pwsh
        run: |
          $platform = if ('${{ matrix.arch }}' -eq 'x86') { 'Win32' } else { 'x64' }
          MSBuild build/Modme.sln /m /p:Configuration=${{ matrix.configuration }} /p:Platform=$platform /verbosity:minimal /nologo
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Use the sanitizer runtime from the build toolset
        if: matrix.configuration == 'ASan'
        shell: pwsh
        run: |
          $platform = if ('${{ matrix.arch }}' -eq 'x86') { 'Win32' } else { 'x64' }
          $tools = & MSBuild build/TestModme.vcxproj /p:Configuration=ASan /p:Platform=$platform /getProperty:VCToolsInstallDir /nologo /verbosity:quiet
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $suffix = if ('${{ matrix.arch }}' -eq 'x86') { 'i386' } else { 'x86_64' }
          $runtime = Join-Path $tools.Trim() "bin/Hostx64/${{ matrix.arch }}/clang_rt.asan_dynamic-$suffix.dll"
          if (!(Test-Path -LiteralPath $runtime)) { throw "ASan runtime is missing: $runtime" }
          Write-Host "ASan runtime: $runtime"
          Copy-Item -LiteralPath $runtime -Destination "build/bin/${{ matrix.arch }}/ASan"
          Split-Path $runtime | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Test in isolated processes
        env:
          ASAN_OPTIONS: halt_on_error=1
        run: python tool/test.py build/bin/${{ matrix.arch }}/${{ matrix.configuration }}/TestModme.exe --report build/results.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-${{ matrix.arch }}-${{ matrix.configuration }}
          path: |
            build/results.xml
            build/bin/${{ matrix.arch }}/${{ matrix.configuration }}/**/*.log
          if-no-files-found: ignore

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python tool/format.py --check
