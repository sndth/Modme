name: Mutations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutations:
    name: Windows ${{ matrix.arch }} mutations
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: ./premake5.exe vs2022
      - run: python tool/mutate.py --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutations-${{ matrix.arch }}
          path: build/mutations/${{ matrix.arch }}
          if-no-files-found: ignore
